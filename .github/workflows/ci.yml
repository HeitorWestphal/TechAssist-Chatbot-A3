name: CI Pipeline TechAssist AI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
    - name: Checkout repositório
      uses: actions/checkout@v4

    - name: Configurar Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Instalar dependências
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov

    - name: Executar suite de testes unitários e de integração (PyTest)
      env:
        PYTHONPATH: .
      run: |
        pytest -v --cov=src --cov-report=term-missing tests/

    - name: Validar integridade da inferência e avaliação (25 casos de teste)
      env:
        PYTHONPATH: .
      run: |
        python src/evaluate.py
